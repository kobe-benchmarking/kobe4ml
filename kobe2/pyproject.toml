[tool.poetry]
name = "kobe2"
version = "0.39"
packages = [
    { include = "kobe2" }
]
description = "Kobe2: Benchmarking for Machine Learning"
authors = [ "Natalia Koliou <nataliakoliou@iit.demokritos.gr>",
	    "Stasinos Konstantopoulos <konstant@iit.demokritos.gr>" ]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.14"        
pandas = "^2.1"
numpy = "^1.26"    
requests = "^2.32"
packaging = "^25.0"
pyyaml = "^6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"