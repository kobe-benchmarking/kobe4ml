[tool.poetry]
name = "predictor"
version = "0.2"
packages = [
    { include = "predictor" }
]
description = "Predictor"
authors = [ "Natalia Koliou <nataliakoliou@iit.demokritos.gr>",
	        "Stasinos Konstantopoulos <konstant@iit.demokritos.gr>" ]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.9,<3.14"      # Python version for the project
torch = "^2.7.0"            # Needed for the PyTorch imports (torch, torch.nn, torch.optim)
boto3 = "^1.37.1"           # Needed for the boto3 import (for interacting with AWS S3)

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
