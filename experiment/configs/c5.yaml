metadata:
  parent_id: dcoss
  id: dcoss_05
  version: v1
  name: BitBrain-Predictor
  description: This run applies a Predictor that forecasts time series on the BitBrain dataset.

implementation:
  package: predictor          
  url: http://127.0.0.1:48035/run 

steps:
  - id: dcoss_05_01
    type: prepare

    parameters:
      save_url: models/predictor.pth 

      model:
        num_feats: 3
        num_heads: 1
        dropout: 0.5
        num_layers: 1

      process:
        batch_size: 512
        loss: BlendedLoss
        epochs: 3
        patience: 30
        lr: 0.00005
        optimizer: AdamW
        scheduler:
          name: ReduceLROnPlateau
          params:
            factor: 0.99
            patience: 3

    data:
      loader:
        package: torch_loader          
        index_url: https://kobe-benchmarking.github.io/kobe4ml/

      name: bitbrain
      location: datasets/bitbrain_conv
      weight: majority

      parameters:
        process: prepare
        train_size: 0.65
        val_size: 0.15
        test_size: 0.20
        seq_len: 240
        norm_include: ['HB_1', 'HB_2', 'time']
        full_epoch: 7680
        per_epoch: True
        time_include: True
        shifted: True
        splitted: True
        weighted: True
        analyzed: True
        normalized: True

    metrics:
      - epochs
      - train_time
      - best_train_loss
      - best_val_loss

  - id: dcoss_05_02
    type: work

    parameters:
      model_url: models/predictor.zip

      process:
        batch_size: 512
        loss: BlendedLoss

    data:
      loader:
        package: torch_loader          
        index_url: https://kobe-benchmarking.github.io/kobe4ml/

      name: bitbrain
      location: datasets/bitbrain_conv
      weight: majority

      parameters:
        process: work
        train_size: 0.65
        val_size: 0.15
        test_size: 0.20
        seq_len: 240
        norm_include: ['HB_1', 'HB_2', 'time']
        full_epoch: 7680
        per_epoch: True
        time_include: True
        shifted: True
        splitted: True
        weighted: True
        analyzed: True
        normalized: True

    metrics:
      - infer_loss
      - mae
      - mse