metadata:
  parent_id: dcoss
  id: dcoss_03
  version: v1
  name: BitBrain-Attn-Autoencoder
  description: This run applies an Attention-based autoencoder architecture that learns to reconstruct the BitBrain time series dataset.   

implementation:
  package: attn_ae          
  url: http://127.0.0.1:48033/run   

steps:
  - id: dcoss_03_01
    type: prepare

    parameters:
      save_url: models/attn_ae.pth 

      model:
        seq_len: 240
        num_feats: 3
        latent_seq_len: 1
        latent_num_feats: 8
        num_heads: 1
        num_layers: 1
        dropout: 0.05

      process:
        batch_size: 512
        loss: BlendedLoss
        epochs: 3
        patience: 30
        lr: 0.0001
        optimizer: Adam
        scheduler:
          name: ReduceLROnPlateau
          params:
            factor: 0.99
            patience: 3

    data:
      loader:
        package: torch_loader          
        index_url: https://kobe-benchmarking.github.io/kobe4ml/

      name: bitbrain
      location: datasets/bitbrain_conv
      weight: majority

      parameters:
        process: prepare
        train_size: 0.65
        val_size: 0.15
        test_size: 0.20
        seq_len: 240
        norm_include: ['HB_1', 'HB_2', 'time']
        full_epoch: 7680
        per_epoch: True
        time_include: True
        shifted: True
        splitted: True
        weighted: True
        analyzed: True
        normalized: True

    metrics:
      - epochs
      - train_time
      - best_train_loss
      - best_val_loss

  - id: dcoss_03_02
    type: work

    parameters:
      model_url: models/attn_ae.zip

      process:
        batch_size: 512
        loss: BlendedLoss

    data:
      loader:
        package: torch_loader          
        index_url: https://kobe-benchmarking.github.io/kobe4ml/

      name: bitbrain
      location: datasets/bitbrain_conv
      weight: majority

      parameters:
        process: work
        train_size: 0.65
        val_size: 0.15
        test_size: 0.20
        seq_len: 240
        norm_include: ['HB_1', 'HB_2', 'time']
        full_epoch: 7680
        per_epoch: True
        time_include: True
        shifted: True
        splitted: True
        weighted: True
        analyzed: True
        normalized: True

    metrics:
      - infer_loss
      - mae
      - mse