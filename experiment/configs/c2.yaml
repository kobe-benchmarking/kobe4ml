metadata:
  parent_id: dcoss
  id: dcoss_02
  version: v1
  name: BitBrain-ConvLSTM-Autoencoder
  description: This run applies an Convolutional LSTM autoencoder architecture that learns to reconstruct the BitBrain time series dataset.   

implementation:
  package: conv_lstm_ae          
  index_url: https://kobe-benchmarking.github.io/kobe4ml/

steps:
  - id: dcoss_02_01
    type: prepare

    parameters:
      save_url: models/conv_lstm_ae.pth 

      model:
        seq_len: 240
        num_feats: 2
        latent_seq_len: 1
        latent_num_feats: 8
        hidden_size: 4
        num_layers: 1
        dropout: 0.05

      process:
        loss: BlendedLoss
        epochs: 3
        patience: 30
        lr: 0.0001
        optimizer: Adam
        scheduler:
          name: ReduceLROnPlateau
          params:
            factor: 0.99
            patience: 3

    data:
      loader:
        package: torch_loader          
        index_url: https://kobe-benchmarking.github.io/kobe4ml/

      name: bitbrain
      location: datasets/bitbrain_conv

      parameters:
        process: prepare
        batch_size: 512
        train_size: 0.65
        val_size: 0.15
        test_size: 0.20
        seq_len: 240
        norm_include: ['HB_1', 'HB_2', 'time']
        full_epoch: 7680
        per_epoch: True
        time_include: False
        shifted: True
        splitted: True
        weighted: True
        analyzed: True
        normalized: True

    metrics:
      - epochs
      - train_time
      - best_train_loss
      - best_val_loss
      - mae
      - mse

  - id: dcoss_02_02
    type: work

    parameters:
      model_url: models/conv_lstm_ae.zip

    data:
      loader:
        package: torch_loader          
        index_url: https://kobe-benchmarking.github.io/kobe4ml/

      name: bitbrain
      location: datasets/bitbrain_conv

      parameters:
        process: work
        batch_size: 512
        train_size: 0.65
        val_size: 0.15
        test_size: 0.20
        seq_len: 240
        norm_include: ['HB_1', 'HB_2', 'time']
        full_epoch: 7680
        per_epoch: True
        time_include: False
        shifted: True
        splitted: True
        weighted: True
        analyzed: True
        normalized: True

    metrics:
      - BlendedLoss
      - mae
      - mse